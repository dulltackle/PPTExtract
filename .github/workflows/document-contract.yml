name: 文档工具链契约

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  document-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --locked --dev
      - name: 读取不可变渲染镜像引用
        id: rendering_image
        run: |
          image="$(uv run python -c 'from pptextract.toolchain import load_toolchain_contract; print(load_toolchain_contract().rendering_image)')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: 拉取已发布的锁定渲染工具链
        run: docker pull "${{ steps.rendering_image.outputs.image }}"
      - name: 阻止第三方构建或配置漂移
        run: >-
          uv run python -m pptextract.toolchain
          --render-image "${{ steps.rendering_image.outputs.image }}"
      - name: 执行完整测试（含真实转换与渲染契约）
        run: uv run pytest
