name: 产品级验收与文档工具链契约

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  document-contract:
    name: 产品级黑盒与契约门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --locked --dev
      - name: 安装锁定前端依赖
        working-directory: web
        run: npm ci
      - name: 安装 Playwright 锁定 Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: 读取不可变渲染镜像引用
        id: rendering_image
        run: |
          image="$(uv run python -c 'from pptextract.toolchain import load_toolchain_contract; print(load_toolchain_contract().rendering_image)')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: 拉取已发布的锁定渲染工具链
        run: docker pull "${{ steps.rendering_image.outputs.image }}"
      - name: 阻止第三方构建或配置漂移
        run: >-
          uv run python -m pptextract.toolchain
          --render-image "${{ steps.rendering_image.outputs.image }}"
      - name: 执行 Python 静态门禁
        run: |
          uv run mypy src/pptextract
          uv run ruff check src tests
      - name: 执行浏览器工作台静态门禁
        working-directory: web
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: 执行完整测试（含产品黑盒、故障注入与真实工具链契约）
        run: uv run pytest
