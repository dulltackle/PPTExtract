[project]
name = "pptextract"
version = "0.1.0"
description = "PPTExtract 单机人工策展平台"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "firecrawl-anydoc==0.1.9",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pillow==11.3.0",
  "pytest>=8.3,<9",
  "python-pptx==1.0.2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptextract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pptextract"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
